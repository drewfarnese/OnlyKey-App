name: Release packages

# Cuts a release: runs the same gates as test.yml, bumps package.json on
# master, tags the bump commit, builds the three installers from that tag,
# and publishes them to a GitHub release for it.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump applied to package.json before building"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Explicit version (X.Y.Z) instead of a bump; leave empty to use the bump"
        required: false
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # A release is never cut from a tree that fails the same gates as test.yml
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level=high

  # Bump package.json, commit it to master, and tag it. Everything downstream
  # builds from the tag so the installers, the in-app version, and the
  # release name all agree.
  version:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Bump version, commit, and tag
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
          EXPLICIT: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          TARGET="${EXPLICIT:-$BUMP}"
          if [ -n "$EXPLICIT" ] && ! [[ "$EXPLICIT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like X.Y.Z, got '$EXPLICIT'"
            exit 1
          fi
          PREVIOUS="$(node -p "require('./package.json').version")"
          # npm version edits package.json only; the pnpm lockfile does not
          # record the root version, so --frozen-lockfile stays valid
          NEW="$(npm version "$TARGET" --no-git-tag-version | sed 's/^v//')"
          TAG="v$NEW"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::tag $TAG already exists; pick a different bump or version"
            exit 1
          fi
          echo "Bumping $PREVIOUS -> $NEW"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Release $TAG"
          git tag -a "$TAG" -m "OnlyKey App $TAG"
          git push origin HEAD:"${GITHUB_REF_NAME}" "refs/tags/$TAG"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.os }} installer
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }

      # Same steps as the package.json `prerelease` script, spelled out so
      # they run under bash on every runner: stage the production-only
      # node_modules that ship inside the app, then a full install for the
      # build tooling and the Electron runtime.
      - name: Stage production dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules release_node_modules
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted
          mkdir release_node_modules
          cp -R node_modules release_node_modules/node_modules
          rm -rf node_modules
          pnpm install --frozen-lockfile

      # pnpm's side-effects cache can restore the electron package without
      # its downloaded runtime; fetch it explicitly when dist/ is missing
      - name: Ensure Electron runtime
        shell: bash
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js

      - name: Build app package
        shell: bash
        run: pnpm run build --env=production

      - name: Build installer
        shell: bash
        run: pnpm exec gulp release --env=production

      - name: List built installer
        shell: bash
        run: ls -la releases/

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            releases/*.deb
            releases/*.exe
            releases/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.tag }}

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: releases
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Publishing release $TAG"
          ls -la releases/
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # Only reached when re-running a failed publish for the same tag
            gh release upload "$TAG" releases/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" releases/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "OnlyKey App $TAG" \
              --generate-notes
          fi
