name: Release packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<package.json version>)"
        required: false
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # A release is never cut from a tree that fails the same gates as test.yml
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm audit --audit-level=high

  build:
    name: ${{ matrix.os }} installer
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")) {
            choco install nsis --no-progress -y
          }

      # Same steps as the package.json `prerelease` script, spelled out so
      # they run under bash on every runner: stage the production-only
      # node_modules that ship inside the app, then a full install for the
      # build tooling and the Electron runtime.
      - name: Stage production dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules release_node_modules
          pnpm install --prod --frozen-lockfile --config.node-linker=hoisted
          mkdir release_node_modules
          cp -R node_modules release_node_modules/node_modules
          rm -rf node_modules
          pnpm install --frozen-lockfile

      # pnpm's side-effects cache can restore the electron package without
      # its downloaded runtime; fetch it explicitly when dist/ is missing
      - name: Ensure Electron runtime
        shell: bash
        run: test -d node_modules/electron/dist || node node_modules/electron/install.js

      - name: Build app package
        shell: bash
        run: pnpm run build --env=production

      - name: Build installer
        shell: bash
        run: pnpm exec gulp release --env=production

      - name: List built installer
        shell: bash
        run: ls -la releases/

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ runner.os }}
          path: |
            releases/*.deb
            releases/*.exe
            releases/*.dmg
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: installer-*
          path: releases
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          fi
          echo "Publishing release $TAG"
          ls -la releases/
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" releases/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" releases/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OnlyKey $TAG" \
              --notes "Automated release build: Linux .deb, Windows NSIS installer, and macOS DMG (Apple Silicon)."
          fi
